plugins {
    alias libs.plugins.android.library
    alias libs.plugins.kotlin.android
}

android {
    compileSdk = compile_sdk_version
    namespace = 'io.legado.app.theme'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }
    defaultConfig {
        minSdk 21
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.annotation
    implementation libs.gson
    // A1-1 seed palette engine: Material 3 tonal palette algorithm (Kotlin port)
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.material3
    // 4.1.1 aligns with material-color-utilities 4.1.1 required by kyant0:shapes;
    // its window-size-class (minSdk 23) is excluded in favor of the BOM's 1.4.0.
    implementation(libs.material.kolor) {
        exclude group: 'androidx.compose.material3', module: 'material3-window-size-class'
        exclude group: 'org.jetbrains.compose.material3', module: 'material3-window-size-class'
        exclude group: 'androidx.graphics', module: 'graphics-shapes'
    }
    testImplementation libs.junit
}
