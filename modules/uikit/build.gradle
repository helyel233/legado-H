plugins {
    alias libs.plugins.android.library
    alias libs.plugins.kotlin.android
    alias libs.plugins.kotlin.compose
}

android {
    compileSdk = compile_sdk_version
    namespace = 'io.legado.app.uikit'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }
    defaultConfig {
        minSdk 21
    }
    buildFeatures {
        compose = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.material3
    implementation libs.core.ktx
    implementation libs.gson
    // A1-4: uikit reads the theme package layer (plan: uikit depends on theme)
    implementation project(':modules:theme')
    // P2 真玻璃：背景模糊（API<31 由库自动降级为半透明 scrim）
    // 用 api 而非 implementation：LocalHazeState 的 HazeState 类型出现在 uikit 公开 API 上
    api libs.haze
    testImplementation libs.junit
}
