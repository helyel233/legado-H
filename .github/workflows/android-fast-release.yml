name: Android Fast Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 H 前缀，如 1.1）'
        required: true
        default: '1.1'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release version
        id: version
        run: |
          VERSION_NAME="H.${{ inputs.version }}"
          # 基线偏移：29860000 高于全部旧版（epoch 分钟数）versionCode，保证应用内检查更新能识别为更新
          VERSION_CODE=$((29860000 + $(git rev-list --count HEAD)))
          TAG_NAME="H-${{ inputs.version }}"
          {
            echo "name=${VERSION_NAME}"
            echo "code=${VERSION_CODE}"
            echo "tag=${TAG_NAME}"
          } >> "$GITHUB_OUTPUT"

  # 正式包（release 签名）：arm64-v8a + armeabi-v7a
  build-release:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Release Apk Sign
        run: |
          echo -e "\n" >> gradle.properties
          echo RELEASE_KEY_ALIAS='${{ secrets.CI_DEBUG_KEY_ALIAS }}' >> gradle.properties
          echo RELEASE_KEY_PASSWORD='${{ secrets.CI_DEBUG_KEY_PASSWORD }}' >> gradle.properties
          echo RELEASE_STORE_PASSWORD='${{ secrets.CI_DEBUG_STORE_PASSWORD }}' >> gradle.properties
          echo RELEASE_STORE_FILE='./key.jks' >> gradle.properties
          echo ${{ secrets.CI_DEBUG_KEY_STORE_B64 }} | base64 --decode > $GITHUB_WORKSPACE/app/key.jks

      - name: Build arm64 release APK
        run: |
          rm -rf app/build/outputs/apk/app/release
          mkdir -p release-apks
          ./gradlew :app:clean :app:assembleAppRelease \
            -Pabi=arm64-v8a \
            -PVERSION_NAME="${{ needs.prepare.outputs.name }}" \
            -PVERSION_CODE="${{ needs.prepare.outputs.code }}" \
            --stacktrace
          APK_PATH=$(find app/build/outputs/apk/app/release -type f -name '*.apk' | head -n 1)
          cp "$APK_PATH" "release-apks/legado-arm64-v8a_app_${{ needs.prepare.outputs.name }}_${{ needs.prepare.outputs.code }}.apk"

      - name: Build armeabi-v7a release APK
        run: |
          rm -rf app/build/outputs/apk/app/release
          ./gradlew :app:clean :app:assembleAppRelease \
            -Pabi=armeabi-v7a \
            -PVERSION_NAME="${{ needs.prepare.outputs.name }}" \
            -PVERSION_CODE="${{ needs.prepare.outputs.code }}" \
            --stacktrace
          APK_PATH=$(find app/build/outputs/apk/app/release -type f -name '*.apk' | head -n 1)
          cp "$APK_PATH" "release-apks/legado-armeabi-v7a_app_${{ needs.prepare.outputs.name }}_${{ needs.prepare.outputs.code }}.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-release-abi
          path: release-apks/*.apk

  # 调试包（ci-debug 签名）：arm64-v8a，与正式包异步并行构建
  build-debug:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Debug Apk Sign
        run: |
          echo -e "\n" >> gradle.properties
          echo RELEASE_STORE_FILE='ci-debug.keystore' >> gradle.properties
          echo RELEASE_STORE_PASSWORD='legado-ci-debug' >> gradle.properties
          echo RELEASE_KEY_ALIAS='legado-ci-debug' >> gradle.properties
          echo RELEASE_KEY_PASSWORD='legado-ci-debug' >> gradle.properties

      - name: Build arm64 debug APK
        run: |
          rm -rf app/build/outputs/apk/app/debug
          mkdir -p release-apks
          ./gradlew :app:clean :app:assembleAppDebug \
            -Pabi=arm64-v8a \
            -PVERSION_NAME="${{ needs.prepare.outputs.name }}" \
            -PVERSION_CODE="${{ needs.prepare.outputs.code }}" \
            --stacktrace
          APK_PATH=$(find app/build/outputs/apk/app/debug -type f -name '*.apk' | head -n 1)
          cp "$APK_PATH" "release-apks/legado-arm64-v8a_app_debug_${{ needs.prepare.outputs.name }}_${{ needs.prepare.outputs.code }}.apk"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-debug-abi
          path: release-apks/*.apk

  publish:
    needs: [prepare, build-release, build-debug]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          name: legado-release-abi
          path: release-apks

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: legado-debug-abi
          path: release-apks

      - name: List APKs
        run: ls -l release-apks/

      - name: Clear existing versioned release APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/${{ needs.prepare.outputs.tag }} --jq '.id' 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            gh api repos/${{ github.repository }}/releases/$RELEASE_ID/assets --paginate \
              --jq '.[] | select(.name | endswith(".apk")) | .id' \
              | while read -r ASSET_ID; do
                  gh api -X DELETE repos/${{ github.repository }}/releases/assets/$ASSET_ID
                done
          fi

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: legado-H ${{ inputs.version }}
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: release-apks/*.apk
          body_path: CHANGELOG.md

      - name: Refresh app update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANNEL_TAG="latest-arm64-release"
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/$CHANNEL_TAG --jq '.id' 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            gh api repos/${{ github.repository }}/releases/$RELEASE_ID/assets --paginate \
              --jq '.[] | select(.name | endswith(".apk")) | .id' \
              | while read -r ASSET_ID; do
                  gh api -X DELETE repos/${{ github.repository }}/releases/assets/$ASSET_ID
                done
            gh release upload "$CHANNEL_TAG" release-apks/legado-arm64-v8a_app_${{ needs.prepare.outputs.name }}_${{ needs.prepare.outputs.code }}.apk --clobber
            gh release edit "$CHANNEL_TAG" \
              --title "legado-H 更新通道" \
              --notes-file CHANGELOG.md
          else
            gh release create "$CHANNEL_TAG" release-apks/legado-arm64-v8a_app_${{ needs.prepare.outputs.name }}_${{ needs.prepare.outputs.code }}.apk \
              --title "legado-H 更新通道" \
              --notes-file CHANGELOG.md
          fi

      - name: Sync release to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_REPO" ]; then
            echo "GITEE 未配置，跳过 Gitee 同步。"
            exit 0
          fi

          set +e
          API="https://gitee.com/api/v5/repos/${GITEE_REPO}"
          TAG_NAME="${{ needs.prepare.outputs.tag }}"
          RELEASE_NAME="legado-H ${TAG_NAME}"
          CHANNEL_TAG="latest-arm64-release"
          TOKEN_QUERY="$(python3 -c 'import os, urllib.parse; print(urllib.parse.urlencode({"access_token": os.environ["GITEE_TOKEN"]}))')"

          if ! git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            git fetch origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
          fi

          GITEE_REMOTE="https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          if git ls-remote --exit-code --tags "$GITEE_REMOTE" "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Gitee tag already exists: $TAG_NAME"
          else
            git push "$GITEE_REMOTE" "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
            echo "Pushed Gitee tag: $TAG_NAME"
          fi

          find_release_id() {
            curl -fsS -G \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              "$API/releases/tags/$1" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))'
          }

          upsert_release() {
            local tag_name="$1"
            local release_name="$2"
            local release_id
            release_id="$(find_release_id "$tag_name" 2>/dev/null || true)"
            if [ -n "$release_id" ]; then
              curl -fsS -X PATCH "$API/releases/$release_id" \
                --data-urlencode "access_token=$GITEE_TOKEN" \
                --data-urlencode "tag_name=$tag_name" \
                --data-urlencode "name=$release_name" \
                --data-urlencode "body=$(cat CHANGELOG.md)" \
                --data-urlencode "prerelease=false" >/dev/null
            else
              release_id="$(curl -fsS -X POST "$API/releases" \
                --data-urlencode "access_token=$GITEE_TOKEN" \
                --data-urlencode "tag_name=$tag_name" \
                --data-urlencode "target_commitish=$tag_name" \
                --data-urlencode "name=$release_name" \
                --data-urlencode "body=$(cat CHANGELOG.md)" \
                --data-urlencode "prerelease=false" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))')"
            fi
            echo "$release_id"
          }

          upload_apks() {
            local release_id="$1"
            if [ -z "$release_id" ]; then
              return 1
            fi
            curl -fsS -G \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              "$API/releases/$release_id/attach_files" \
              | python3 -c 'import json,sys; data=json.load(sys.stdin); [print(item.get("id")) for item in data if str(item.get("name", "")).endswith(".apk")]' \
              | while read -r attach_id; do
                  if [ -n "$attach_id" ]; then
                    curl -fsS -X DELETE "$API/releases/$release_id/attach_files/$attach_id?$TOKEN_QUERY" >/dev/null
                  fi
                done
            for apk in release-apks/*.apk; do
              curl -fsS -X POST "$API/releases/$release_id/attach_files" \
                -F "access_token=$GITEE_TOKEN" \
                -F "file=@$apk" >/dev/null || return 1
            done
          }

          SYNC_FAILED=0
          VERSIONED_ID="$(upsert_release "$TAG_NAME" "$RELEASE_NAME")" || SYNC_FAILED=1
          upload_apks "$VERSIONED_ID" || SYNC_FAILED=1

          if git ls-remote --exit-code --tags "$GITEE_REMOTE" "refs/tags/$CHANNEL_TAG" >/dev/null 2>&1; then
            echo "Gitee update channel tag already exists: $CHANNEL_TAG"
          else
            git push "$GITEE_REMOTE" "HEAD:refs/tags/$CHANNEL_TAG"
            echo "Pushed Gitee update channel tag: $CHANNEL_TAG"
          fi

          CHANNEL_ID="$(upsert_release "$CHANNEL_TAG" "legado-H 更新通道")" || SYNC_FAILED=1
          upload_apks "$CHANNEL_ID" || SYNC_FAILED=1

          if [ "$SYNC_FAILED" -ne 0 ]; then
            echo "Gitee release sync failed, GitHub release has already been published."
            exit 0
          fi
          echo "Gitee release sync finished."
