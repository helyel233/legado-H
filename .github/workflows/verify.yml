name: Verify

# 编译 + 单测门禁。
#
# 以前所有流水线都是 workflow_dispatch 手动触发的打包任务，不跑单测，
# 于是「本地编译过但单测挂了」「推上去才发现编不过」都只能靠人发现。
# 这里补一条自动门禁：推 main 或开 PR 时自动编译并跑 JVM 单测，挂了直接拦下。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# 同一分支连续推送时取消上一轮，避免排队浪费额度
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compile and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install AAPT2 runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-i386 lib32stdc++6 lib32z1 libncurses6 libtinfo6

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Sanitize Gradle AAPT2 caches
        run: |
          rm -rf ~/.gradle/caches/*/transforms
          rm -rf ~/.gradle/caches/*/transforms-*
          rm -rf ~/.gradle/caches/modules-2/files-2.1/com.android.tools.build/aapt2

      - name: Compile
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-XX:+UseParallelGC\ -Xmx4g\ -Xms256m\ -XX:MaxMetaspaceSize=768m\ -Dfile.encoding=UTF-8
            -Dorg.gradle.workers.max=2
        run: |
          ./gradlew :app:compileAppDebugKotlin \
            --no-daemon \
            --max-workers=2 \
            --stacktrace

      - name: Unit tests
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-XX:+UseParallelGC\ -Xmx4g\ -Xms256m\ -XX:MaxMetaspaceSize=768m\ -Dfile.encoding=UTF-8
            -Dorg.gradle.workers.max=2
        run: |
          ./gradlew :app:testAppDebugUnitTest \
            --no-daemon \
            --max-workers=2 \
            --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

      # lint 目前只是报告，不拦人：这个仓库存量告警不少，先让结果跑出来看看，
      # 等告警清到可控范围再改成阻塞。
      - name: Lint (report only)
        continue-on-error: true
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-XX:+UseParallelGC\ -Xmx4g\ -Xms256m\ -XX:MaxMetaspaceSize=768m\ -Dfile.encoding=UTF-8
            -Dorg.gradle.workers.max=2
        run: |
          ./gradlew :app:lintAppDebug \
            --no-daemon \
            --max-workers=2

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-appDebug.*
          retention-days: 14
          if-no-files-found: ignore